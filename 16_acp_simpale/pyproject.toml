[project]
name = "acp-simpale-lab"
version = "0.1.0"
description = "Antigravity ACP (Agent Client Protocol) 实验与全功能测试套件"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-client-protocol>=1.0.0",
    "rich>=13.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
acp-suite = "acp_lab.scenarios:main"
acp-repl = "acp_lab.repl:main"
acp-sdk-demo = "acp_lab.sdk_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acp_lab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
